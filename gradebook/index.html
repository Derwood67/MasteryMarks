<body>
<title>Echols Standards Gradebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with tab strip; single working column (max 880px) of roster rows and cards. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#17201C; --muted:#5A6862; --line:#CFD8D3;
  --accent:#1E6A50; --accent-ink:#FFFFFF; --accent-soft:#D6EBE2;
  --s1:#C0482A; --s2:#B08A06; --s3:#2E8A55; --s4:#2D63B4; --on-score:#FFFFFF;
  --warn-bg:#FFF4D6; --warn-ink:#6E4B00;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201D; --sunk:#222C28; --ink:#E5ECE8; --muted:#9AA8A1; --line:#2F3B36;
  --accent:#5CC39A; --accent-ink:#0C1512; --accent-soft:#1D3A2F;
  --s1:#D25E3E; --s2:#C29C26; --s3:#3E9E69; --s4:#5C8BDB; --on-score:#0C1512;
  --warn-bg:#3A2F12; --warn-ink:#F2D58A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201D; --sunk:#222C28; --ink:#E5ECE8; --muted:#9AA8A1; --line:#2F3B36;
  --accent:#5CC39A; --accent-ink:#0C1512; --accent-soft:#1D3A2F;
  --s1:#D25E3E; --s2:#C29C26; --s3:#3E9E69; --s4:#5C8BDB; --on-score:#0C1512;
  --warn-bg:#3A2F12; --warn-ink:#F2D58A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:8px 12px;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
.status{font-size:.78rem;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:700 .92rem var(--f-body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.02rem;margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .92rem var(--f-body);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--s1)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.sc:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 .9rem var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.88rem;min-width:0}
input[type=text],select,textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.code{font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--sunk);padding:2px 6px;border-radius:5px;white-space:nowrap}
.stdbox{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;min-width:0}
.li:first-child{border-top:0}
.li .name{flex:1 1 140px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.scores{display:flex;gap:6px}
.sc{appearance:none;width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 1.05rem var(--f-display);cursor:pointer;font-variant-numeric:tabular-nums}
.sc.sm{width:36px;height:36px;font-size:.92rem}
.sc[data-v="1"][aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:var(--on-score)}
.sc[data-v="2"][aria-pressed="true"]{background:var(--s2);border-color:var(--s2);color:var(--on-score)}
.sc[data-v="3"][aria-pressed="true"]{background:var(--s3);border-color:var(--s3);color:var(--on-score)}
.sc[data-v="4"][aria-pressed="true"]{background:var(--s4);border-color:var(--s4);color:var(--on-score)}
.sc.sugg{border-style:dashed;border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.rev{background:var(--warn-bg);color:var(--warn-ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;font:800 .85rem var(--f-display);color:var(--on-score);font-variant-numeric:tabular-nums}
.b1{background:var(--s1)}.b2{background:var(--s2)}.b3{background:var(--s3)}.b4{background:var(--s4)}.b0{background:var(--sunk);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:.9rem}
.sub{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--line);min-width:0}
.sub:first-child{border-top:0}
.subhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.subhead .name{flex:1 1 140px;font-weight:700;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumbs img{height:72px;width:auto;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--sunk)}
.stdline{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.stdline .why{grid-column:1 / -1;font-size:.86rem;color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:"Times New Roman",Times,serif;font-size:1.08em;line-height:1.2;margin:.15em .22em}
.frac>span{padding:0 .3em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.05em}
.qlist>div{padding:14px 0;border-top:1px dashed var(--line)}
.qlist>div:first-child{border-top:0;padding-top:4px}
.feedback{font-size:.92rem;border-left:3px solid var(--accent);padding-left:10px}
details summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--accent)}
pre.tx{white-space:pre-wrap;font:400 .88rem/1.5 var(--f-body);background:var(--sunk);padding:10px 12px;border-radius:8px;margin:8px 0 0;max-height:280px;overflow:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.checklist{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px}
.checklist .grp{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer;font-size:.9rem}
.checklist label:hover{background:var(--sunk)}
.checklist input{margin-top:3px;width:18px;height:18px;flex:none}
.aitem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.aitem:first-child{border-top:0}
.aitem:hover{background:var(--sunk)}
.aitem .t{flex:1 1 200px;min-width:0}
.aitem .t b{display:block;overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;max-width:820px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.sheet img.page{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
#jobBtn .btn{min-height:36px;padding:6px 12px;font-size:.84rem;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.job{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.job:first-child{border-top:0}
.job .t{flex:1 1 180px;min-width:0}
.qfb{display:flex;flex-direction:column;margin-top:8px}
.qi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.qi:first-child{border-top:0}
.qmark{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-score)}
.qi.ok .qmark{background:var(--s3)}
.qi.no .qmark{background:var(--s1)}
.chart{display:flex;flex-direction:column;gap:10px}
.chart h4{margin:0;font:700 .92rem var(--f-body)}
.hb{display:grid;grid-template-columns:minmax(84px,auto) 1fr 44px;gap:6px 10px;align-items:center;font-size:.85rem}
.hb .lab{min-width:0;overflow-wrap:anywhere}
.track{position:relative;height:18px;background:var(--sunk);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;min-width:2px}
.goal{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink);opacity:.55}
.hb .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.vb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start;padding-top:8px}
.vb .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.vb .barwrap{height:130px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.vb .lvl{font-weight:800;font-variant-numeric:tabular-nums}
.vb .lvn{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.vb .bar{width:70%;max-width:64px;border-radius:4px 4px 0 0;min-height:2px}
.vb .n{font-weight:700;font-size:.78rem;font-variant-numeric:tabular-nums}
.chip-re{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--s1);color:var(--on-score)}
.chip-ok{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:30;max-width:calc(100% - 40px)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:.9rem}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
</style>

  <div class="wrap">
    <div class="toprow">
      <h1>Standards Gradebook<small id="hdrSub">NC Standard Course of Study · Grades 4–5</small></h1>

</header>

 4:{ ela:ela(4),

function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){const v=attrs[k]; if(v==null||v===false) continue;
    if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="class") el.className=v; else if(k==="html") el.innerHTML=v;
    else if(v===true) el.setAttribute(k,""); else el.setAttribute(k,v);}
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:String(c)); }
  return el;
}

function put(col,id,data){
  if(col==="settings") S.settings=data; else S[col][id]=data;
  render();
  if(!CAP.db){saveLocal();return}
  const p=col+"/"+id; dirty.add(p);
  if(wq[p]){wq[p].data=data;return}
  wq[p]={data};
  (async()=>{const q=wq[p];
    while(q.data){const d=q.data;q.data=null;
      try{await CAP.db.doc(p).set(JSON.parse(JSON.stringify(d)))}
      catch(e){ if(e&&e.code==="unavailable"){q.data=q.data||d;await new Promise(r=>setTimeout(r,800+Math.random()*800))} else {toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old submissions to make room.":"Couldn't save. Check your connection.");} }
    }
    delete wq[p]; dirty.delete(p); setStatus();
  })();
  setStatus();
}

function subscribe(col){
  let first=true; const t=setTimeout(()=>{if(first){$("status").textContent="Can't reach saved data yet";}},10000);
  CAP.db.collection(col).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){first=false;clearTimeout(t);setStatus()}
    if(col==="settings"){const d=snap.docs.find(d=>d.id==="main"); if(d&&!dirty.has("settings/main")) S.settings={...d.data()}; render(); return}
    const next={};
    for(const d of snap.docs){const p=col+"/"+d.id; next[d.id]=dirty.has(p)&&S[col][d.id]?S[col][d.id]:{...d.data(),id:d.id}}
    for(const p of dirty){const [c,id]=p.split("/"); if(c===col&&S[col][id]&&!next[id]) next[id]=S[col][id]}
    S[col]=next; render(); if(col==="batches"&&!snap.metadata.fromCache) setTimeout(maybeAutoResume,1500);
  },e=>{clearTimeout(t);$("status").textContent="Saved data unavailable"});
}

async function sampleJson(prompt,opts,onWait){
  const waits=[15,30,60,90,120];
  for(let i=0;;i++){
    try{ return await CAP.sample.json(prompt,opts); }
    catch(e){
      const code=e&&e.code; const retry=code==="rate_limited"||code==="unavailable"||code==="timeout"||code==="network"||code==="overloaded"||!code;
      if(!retry||i>=waits.length) throw e;
      const w=waits[i]; if(onWait) onWait(w); else toast(`Claude is busy. Trying again in ${w} seconds…`,2500);
      await new Promise(r=>setTimeout(r,w*1000));
    }
  }
}

}

  const useText=()=>{doc.setFont(fn,fst);doc.setFontSize(fs)}, useFrac=()=>{doc.setFont("times","normal");doc.setFontSize(ff)};
  const segW=g=>{ if(g.s!=null){useText();return doc.getTextWidth(g.s)} useFrac(); const w=Math.max(doc.getTextWidth(g.n),doc.getTextWidth(g.d))+6+2*pad; useText(); return w; };

    const words=para.split(/\s+/).filter(Boolean); let line=[], w=0;

    if(need) need(lh);

/* Removes blank pages from every saved paper, assignment scan and rubric. */
async function removeBlankPages(){
  if(S.busy.blankclean) return;
  setBusy("blankclean","Checking saved pages for blank ones…"); let removed=0, checked=0;
  try{
    const fix=async (col,rec,field)=>{
      const pages=rec[field]||[]; if(!pages.length) return; const keep=[];
      for(const p of pages){ checked++; let blank=false;
        try{ const r=await fetch(pageSrc(p)); if(r.ok) blank=await isBlank(await r.blob()); }catch(e){}
        if(blank){ removed++; if(p.asset&&CAP.assets) CAP.assets.delete(p.asset).catch(()=>{}); } else keep.push(p); }
      if(keep.length!==pages.length) put(col,rec.id,{...S[col][rec.id],[field]:keep});
    };
    for(const sub of Object.values(S.submissions)) await fix("submissions",sub,"pages");
    for(const a of Object.values(S.assignments)) await fix("assignments",a,"pages");
    for(const c of Object.values(S.custom)) await fix("custom",c,"rubricPages");
    toast(removed?`Removed ${removed} blank page${removed>1?"s":""} out of ${checked} checked.`:checked?`No blank pages found in ${checked} saved pages.`:"There are no saved pages yet.");
  }finally{ setBusy("blankclean",null); }
}

const TIERS=["low","avg","adv"];

  avg:"ON LEVEL version, for students working at grade level. Typical grade-level rigor and numbers for these standards.",
  adv:"ADVANCED version, for academically advanced students. Assess the same standards with the same number of questions, but raise the rigor: multi-step problems, larger or less friendly numbers, richer vocabulary, a more complex passage if there is one, and at least two questions that ask students to justify, compare, or extend their reasoning."
};

function wsPreview(ws,open,math){

        h("div",{class:"muted"},"Answer: ",fr(q.answer,math),q.std?["  ·  ",h("span",{class:"code"},q.std)]:null)))));

function parseWs(r,codes){
  const qs=(Array.isArray(r&&r.questions)?r.questions:[]).slice(0,30).map(q=>({
    text:String(q&&q.text||"").slice(0,800),
    choices:Array.isArray(q&&q.choices)?q.choices.filter(Boolean).slice(0,5).map(c=>String(c).replace(/^[A-E][.)]\s*/,"").slice(0,200)):[],
    answer:String(q&&q.answer||"").slice(0,400), notes:String(q&&q.notes||"").slice(0,300),
    std:codes.includes(String(q&&q.std))?String(q.std):"", lines:Math.max(0,Math.min(8,Math.round(Number(q&&q.lines))||0))
  })).filter(q=>q.text).map((q,i)=>({...q,n:String(i+1),lines:q.choices.length?0:Math.max(q.lines,1)}));
  if(!qs.length) return null;
  const ws={title:String(r.title||"").slice(0,120),directions:String(r.directions||"").slice(0,500),passage:String(r.passage||"").slice(0,4000),questions:qs};
  const key={answers:qs.map(q=>({n:q.n,question:q.text.slice(0,200),answer:q.answer,notes:q.notes,std:q.std})),madeAt:Date.now()};
  return {ws,key};
}
async function makeAssignment(){
  if(!draft.codes.length){toast("Pick at least one standard below first.");return}
  draft.busy="Writing 3 versions: Approaching, On level and Advanced…"; draw();
  const n=draft.mkN||10, codes=[...draft.codes];
  const common=[`Write a classroom assignment (a paper worksheet) for a North Carolina grade ${draft.grade} ${SUBJ[draft.subj]} class.`,
    `It must assess these NC Standard Course of Study standards:\n${codes.map(c=>`- ${c}: ${STDTEXT[c]}`).join("\n")}`,
    draft.mkTopic&&draft.mkTopic.trim()?`Topic or focus from the teacher: ${draft.mkTopic.trim()}`:"",
    `Number of questions: ${n}. Question style: ${draft.mkType||"Mix of types"}.`];
  const rules=`Students are 9–11 years old: use clear, kid-friendly wording and familiar real-world contexts. Each question assesses exactly one of the listed standards; spread the questions across all of them. Everything must work on paper with no pictures: describe any shapes, graphs or models in words, and ask students to draw their own when useful. ${draft.mkPassage?`Write a short original passage (grade-appropriate for this version, on the topic) in "passage", and base at least half of the questions on it (for math, a story or real-world scenario with numbers to use).`:`If a reading standard is listed, write a short original passage in "passage" and base those questions on it; otherwise leave "passage" empty.`} ${draft.mkWord?"Make at least half of the questions word problems: short real-world situations kids know, with names, places and quantities.":""} ${draft.subj==="math"?"Write every fraction as numerator/denominator with no spaces around the slash (e.g. 3/4; mixed numbers like 2 1/3); they are printed in stacked form. Never use the slash for anything else: use ÷ for division and write dates in words.":""} Never mention the version, level, or difficulty on the student page. Do not mention AI anywhere.`;
  const shape=`Reply with only this JSON object:\n{"title": "short worksheet title (the same topic title for every version)", "directions": "one or two sentences of student directions", "passage": "", "questions": [{"text": "the question", "choices": ["four options for multiple choice, otherwise an empty list"], "answer": "the correct answer (for multiple choice, the letter and option, e.g. B) 3/4)", "notes": "what a full-credit answer needs, or acceptable variations", "std": "the one standard code this question assesses", "lines": 3}]}\nUse "lines" for how many answer lines a student needs (0 for multiple choice, up to 8).`;
  try{
    const res=await Promise.all(TIERS.map(l=>sampleJson([...common,`This is the ${TIER_GUIDE[l]}`,rules,shape].filter(Boolean).join("\n\n"),{modelTier:"default",cache:false}).then(r=>parseWs(r,codes)).catch(e=>({err:e}))));
    const failed=res.find(x=>!x||x.err);
    if(failed) throw (failed&&failed.err)||new Error("One of the versions came back empty. Try again.");
    draft.versions={}; TIERS.forEach((l,i)=>draft.versions[l]=res[i]);
    draft.ws=draft.versions.avg.ws; draft.key=draft.versions.avg.key; draft.tab="avg";
    if(!draft.title.trim()&&draft.ws.title) draft.title=draft.ws.title;
    draft.pages=[];
  }catch(e){ toast(errMsg(e,"Couldn't write the assignment. Try again.")); }
  finally{ draft.busy=""; draw(); }
}

function drawWorksheet(doc,a,ws,form,name){

  if(form) doc.text(`Form ${form}`,W-M,30,{align:"right"});
  doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(23,32,28);
  const tl=doc.splitTextToSize(ws.title||a.title,TW); doc.text(tl,M,58); cur.y=58+tl.length*22;
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setDrawColor(120,130,125); doc.setLineWidth(0.6);

  doc.text("Date",M+TW*0.66,cur.y+6); doc.line(M+TW*0.66+30,cur.y+8,M+TW,cur.y+8); cur.y+=34;
  doc.setDrawColor(23,32,28);

  if(ws.passage){
    need(60); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(30,106,80); doc.text("Read the passage.",M,cur.y+10); cur.y+=18;
    doc.setFont("times","normal"); doc.setTextColor(23,32,28);
    let segTop=cur.y; const pneed=n=>{ if(cur.y+n>H-48){ doc.setDrawColor(30,106,80); doc.setLineWidth(1.5); doc.line(M+4,segTop,M+4,cur.y); doc.addPage(); cur.y=56; segTop=56; doc.setLineWidth(0.6); doc.setDrawColor(23,32,28);} };
    drawRich(doc,ws.passage,M+14,cur,TW-14,12,math,pneed);
    doc.setDrawColor(30,106,80); doc.setLineWidth(1.5); doc.line(M+4,segTop,M+4,cur.y); doc.setLineWidth(0.6); doc.setDrawColor(23,32,28); cur.y+=16;
  }
  const QX=M+numColW(doc,ws.questions.map(q=>q.n),11.5)+8;
  ws.questions.forEach((q,qi)=>{
    if(qi){ need(30); cur.y+=12; doc.setDrawColor(200,208,204); doc.setLineWidth(0.6); doc.setLineDashPattern([3,3],0); doc.line(M,cur.y,M+TW,cur.y); doc.setLineDashPattern([],0); cur.y+=16; }
    need(q.choices.length?90:50+Math.min(q.lines,3)*24);
    doc.setFontSize(11.5); doc.setTextColor(23,32,28); const pg0=doc.getCurrentPageInfo().pageNumber; cur.firstBase=null;
    doc.setFont("helvetica","normal"); doc.setDrawColor(23,32,28); drawRich(doc,q.text,QX,cur,M+TW-QX,11.5,math,need); cur.y+=2;
    { const pg1=doc.getCurrentPageInfo().pageNumber; if(pg1!==pg0) doc.setPage(pg0); doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.text(q.n+".",M,cur.firstBase); if(pg1!==pg0) doc.setPage(pg1); doc.setFont("helvetica","normal"); }
    if(q.choices.length){
      q.choices.forEach((c,i)=>{ const y0=cur.y; doc.setDrawColor(23,32,28); doc.setLineWidth(0.7);
        drawRich(doc,`${"ABCDE"[i]}.  ${c}`,QX+18,cur,M+TW-QX-18,11,math,need); const mid=y0+(cur.y-y0)/2; doc.circle(QX+7,Math.min(mid,cur.y-6),5); });

/* copies: [{lvl, name}] — one worksheet per entry, each starting on a new page */
async function wsPdf(a,copies,fname){
  
  try{
    toast("Building PDF…");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
    const starts=[];
    copies.forEach((c,i)=>{ if(i) doc.addPage(); starts.push(doc.getNumberOfPages()); const v=verOf(a,c.lvl);
      drawWorksheet(doc,a,v.ws,a.versions?TIER[c.lvl].form:"",c.name); });
    starts.push(doc.getNumberOfPages()+1);
    for(let k=0;k<copies.length;k++){ const first=starts[k], last=starts[k+1]-1, tot=last-first+1;
      for(let p=first;p<=last;p++){ doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140,150,145);
        doc.text(`${copies[k].name?copies[k].name+"  ·  ":""}Page ${p-first+1} of ${tot}`,W-54,H-24,{align:"right"}); } }
    await outPdf(doc,`${fname.replace(/[^\w ,.-]+/g,"").slice(0,90)}.pdf`);
    toast("Worksheet saved.");
  }catch(e){ if(e&&e.code==="declined") return; toast("Couldn't build the worksheet PDF. Try again."); }
}

async function customPdf(c){
  
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=72, TW=W-2*M;
    const cur={y:72}; const need=n=>{ if(cur.y+n>H-60){ doc.addPage(); cur.y=72; } };
    const me=c.audience==="me";
    doc.setTextColor(23,32,28); doc.setDrawColor(23,32,28);
    doc.setFont("times","bold"); doc.setFontSize(16); const tl=doc.splitTextToSize(c.title,TW); doc.text(tl,W/2,cur.y,{align:"center"}); cur.y+=tl.length*20+4;
    doc.setFont("times","normal"); doc.setFontSize(12);
    const by=[me?(S.settings.author||teacherName()):teacherName(),c.course,new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})].filter(Boolean);
    by.forEach(l=>{doc.text(l,W/2,cur.y,{align:"center"});cur.y+=16}); cur.y+=14;
    for(const block of c.body.split(/\n{2,}/)){
      const t=block.trim(); if(!t) continue;
      if(/^##\s+/.test(t)){ need(40); cur.y+=6; doc.setFont("times","bold"); doc.setFontSize(13); const hl=doc.splitTextToSize(t.replace(/^##\s+/,""),TW); doc.text(hl,M,cur.y); cur.y+=hl.length*17+4; continue; }
      doc.setFont("times","normal"); doc.setFontSize(12);
      for(const line of doc.splitTextToSize(t.replace(/\n/g," "),TW)){ need(18); doc.text(line,M,cur.y); cur.y+=18; }
      cur.y+=8;
    }
    const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("times","normal");doc.setFontSize(10);doc.setTextColor(110,110,110);doc.text(String(i),W/2,H-36,{align:"center"})}
    await outPdf(doc,`${c.title.replace(/[^\w ,.-]+/g,"").slice(0,90)}.pdf`);
    toast("PDF saved.");
  }catch(e){ if(e&&e.code==="declined") return; toast("Couldn't build the PDF. Try again."); }
}

let PRINTING=false;
async function printIt(fn){ PRINTING=true; try{ await fn(); } finally{ PRINTING=false; } }
async function outPdf(doc,filename){
  if(!PRINTING) return saveFile({filename,data:doc.output("blob")});
  PRINTING=false; doc.autoPrint();
  if(!CAP.downloads){
    const url=URL.createObjectURL(doc.output("blob"));
    const f=document.createElement("iframe"); f.title="Print"; f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
    f.onload=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ window.open(url,"_blank"); } };
    f.src=url; document.body.append(f); setTimeout(()=>{f.remove();URL.revokeObjectURL(url)},120000);
    toast("Opening the print dialog…",4000); return {status:"printed"};
  }
  const r=await saveFile({filename,data:doc.output("blob")});
  toast("Saved. Open the PDF and the print dialog comes up automatically.",5000); return r;

      const subs=Object.values(S.submissions).filter(s=>s.studentId===st.id&&s.status==="accepted"&&S.assignments[s.assignmentId]).sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0));
      if(subs.length){
        doc.autoTable({startY:y,margin:{left:40,right:40},head:[[{content:"Graded assignments",colSpan:3}],["Date","Assignment","Scores"]],
          body:subs.map(s=>{const a=S.assignments[s.assignmentId];return [fmtDate(s.submittedAt),a.title,codesFor(a,st).map(c=>`${c}: ${(s.scores||{})[c]||"–"}`).join("   ")]}),
          theme:"grid",styles:{fontSize:8.5,cellPadding:4,lineColor:[207,216,211],textColor:[23,32,28]},headStyles:{fillColor:[227,233,229],textColor:[23,32,28]},
          columnStyles:{0:{cellWidth:72}},didParseCell:d=>{if(d.section==="head"&&d.row.index===0){d.cell.styles.fillColor=[30,106,80];d.cell.styles.textColor=[255,255,255]}}});
      }
      if(y===104&&!subs.length){doc.setFontSize(10);doc.setTextColor(90,104,98);doc.text("No standards have been scored yet.",40,y+10)}
    });
    const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140,150,145);doc.text(`Page ${i} of ${n}`,W-40,doc.internal.pageSize.getHeight()-24,{align:"right"})}
    const name=list.length===1?`${list[0].name.replace(/[^\w ]+/g,"")} standards report.pdf`:`Standards reports ${new Date().toISOString().slice(0,10)}.pdf`;
    await outPdf(doc,name);
    toast("PDF saved.");
  }catch(e){
    if(e&&e.code==="declined") return;
    toast(e&&e.code?"Couldn't save the PDF. Try again.":"Couldn't build the PDF. Check your connection and try again.");
  }
}

/* ---------------- boot ---------------- */
draw();
(async()=>{
  const C=window.claude;
  const [db,assets,sample,downloads]=C&&C.use?await Promise.all(["db","assets","sample","downloads"].map(n=>C.use(n).catch(()=>null))):[null,null,null,null];
  CAP.db=db; CAP.assets=assets; CAP.sample=sample; CAP.downloads=downloads;
  if(sample){ try{const l=await sample.limits(); if(l&&l.images) CAP.imgMax=Math.max(1,l.images.maxCount); else CAP.imgOK=false; }catch(e){} }
  CAP.ready=true;
  if(db){ ["students","assignments","submissions","settings","rosters","custom","batches"].forEach(subscribe); } else loadLocal();
  setStatus(); render();
})();
</script>

<script>
/* Installable app: offline cache + Install button (Chrome and Edge on Windows and Mac). */
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredInstall=e;
  if(document.getElementById("installBtn")) return;
  const b=document.createElement("button"); b.id="installBtn"; b.textContent="Install app";
  b.onclick=async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(()=>{}); deferredInstall=null; b.remove(); };
  const st=document.getElementById("status"); st.parentNode.insertBefore(b,st);
});
window.addEventListener("appinstalled",()=>{const b=document.getElementById("installBtn"); if(b) b.remove();});
</script>
</body>
